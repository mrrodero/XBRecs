[project]
name = "xrecommender-testenv"
version = "0.1.0"
description = "Plugin de pytest de XBRecs: fija el entorno de pruebas por defecto antes de que Django se inicie."
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["testenv"]
