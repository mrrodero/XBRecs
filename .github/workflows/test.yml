name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xrecommender

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: xrecommender_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xrecommender_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DEBUG: "1"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/xrecommender_dev

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            xrecommender/requirements-dev.txt
            elliot/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      # Plugin de pytest (módulo `testenv`): paquete editable local, fuera
      # de requirements-dev.txt para que pip-audit pueda auditar ese archivo.
      - name: Instalar plugin de pruebas (editable)
        run: python -m pip install -e ../devtools

      - name: Ruff (lint)
        run: ruff check ../xrecommender ../scripts ../elliot ../devtools

      - name: Pruebas (pytest)
        run: pytest
