name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Auditoría semanal de dependencias.
    - cron: "0 6 * * 1"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xrecommender
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar pip-audit
        run: python -m pip install pip-audit

      # El paquete editable local `devtools` no se lista en
      # requirements-dev.txt (pip-audit no puede auditar paquetes que no
      # existen en PyPI), así que no hace falta ninguna bandera especial.
      - name: Auditar dependencias de la aplicación
        run: pip-audit -r requirements.txt --strict

      - name: Auditar dependencias de desarrollo
        run: pip-audit -r requirements-dev.txt --strict
