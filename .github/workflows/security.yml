name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Auditoría semanal de dependencias.
    - cron: "0 6 * * 1"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    # El CWD importa: pip resuelve las rutas relativas de los archivos
    # de requisitos (p. ej. `-e ../devtools`) respecto al directorio de
    # trabajo, no respecto al archivo. Por eso se ejecuta desde
    # `xrecommender/`, igual que el workflow de tests.
    defaults:
      run:
        working-directory: xrecommender
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar pip-audit
        run: python -m pip install pip-audit

      # `--skip-editable`: los paquetes editables (devtools/testenv) no
      # existen en PyPI y pip-audit no puede auditarlos.
      - name: Auditar dependencias de la aplicación
        run: pip-audit -r requirements.txt --strict --skip-editable

      - name: Auditar dependencias de desarrollo
        run: pip-audit -r requirements-dev.txt --strict --skip-editable
