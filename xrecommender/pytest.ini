[pytest]
DJANGO_SETTINGS_MODULE = xrecommender.settings
python_files = tests.py test_*.py
norecursedirs = .* pytest-cache-files-*
# --reuse-db: reutiliza la BD de tests entre ejecuciones (en el servidor
# local sandboxeado no se puede DROP DATABASE; en CI el contenedor es
# nuevo y se crea sin problemas).
addopts = --strict-markers -q -p testenv -p no:cacheprovider --reuse-db
